[project]
name = "examdata"
version = "0.1.0"
description = "国际考试真题统一数据服务 - International exam paper unified data service"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pymupdf>=1.24",
    "typer>=0.12",
    "rich>=13.7",
    # 只读检索 API。httpx 已作为抓取依赖存在，TestClient 直接复用。
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
examdata = "examdata.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
examdata = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tmpwork/ 是 pip 沙箱用的临时根目录，DACL 受限且无法删除。
# 不排除它会让 pytest 在收集阶段就因 PermissionError 整体中断。
norecursedirs = ["tmpwork", ".venv", ".data", "wheels", ".piptmp"]
addopts = "-q"
