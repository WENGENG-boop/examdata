<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Examdata</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0c'/%3E%3Cpath d='M10 9h12M10 16h9M10 23h12M10 9v14' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='23' r='2.4' fill='%23ff4d00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="/app.css">
<script>try{const t=localStorage.getItem('xd-theme');if(t)document.documentElement.dataset.theme=t;const l=localStorage.getItem('xd-lang')||(navigator.language.startsWith('zh')?'zh':'en');document.documentElement.lang=l==='zh'?'zh-CN':'en';document.documentElement.dataset.lang=l;if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!sessionStorage.getItem('xd-intro')){document.documentElement.classList.add('intro-pending');setTimeout(()=>document.documentElement.classList.remove('intro-pending'),4000)}}catch{}</script>
<style>.intro-pending body::before{content:"";position:fixed;inset:0;background:#0b0b0c;z-index:299}</style>
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-right">
        <div class="lang-switch top-lang" data-lang-switch></div>
        <button class="top-search" id="open-palette-top" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><kbd>Ctrl K</kbd></button>
      </div>
    </header>
    <main id="page" class="page" tabindex="-1"></main>
  </div>
</div>

<aside class="peek" id="peek" aria-hidden="true">
  <div class="peek-bar">
    <button class="icon-btn" id="peek-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m13 6 6 6-6 6M5 6l6 6-6 6"/></svg></button>
    <span class="peek-title" id="peek-title"></span>
  </div>
  <div class="peek-body" id="peek-body"></div>
</aside>
<div class="scrim" id="scrim"></div>

<dialog class="palette" id="palette">
  <div class="palette-input">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    <input id="palette-input" autocomplete="off" spellcheck="false">
    <kbd>Esc</kbd>
  </div>
  <div class="palette-list" id="palette-list" role="listbox"></div>
  <div class="palette-foot" id="palette-foot"></div>
</dialog>
</body>
</html>
